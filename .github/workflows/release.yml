name: Build and release

on:
  push:
    branches: [main]

# The compiler/test job cannot publish. Only the dependent release job can write.
permissions: {}

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the documented Zig toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.17.1'
          $archive = Join-Path $env:RUNNER_TEMP 'zig.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'release-zig'
          Invoke-WebRequest "https://ziglang.org/download/$version/zig-x86_64-windows-$version.zip" -OutFile $archive
          # SHA-256 from https://ziglang.org/download/index.json for this exact archive.
          $expected = 'b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {
            throw 'Zig archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $zig = Join-Path $destination "zig-x86_64-windows-$version/zig.exe"
          $actual = & $zig version
          if ($LASTEXITCODE -ne 0 -or $actual -cne $version) { throw 'Unexpected Zig compiler version.' }
          "ZIG=$zig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test release publication logic without network writes
        run: node --test .github/tests/publish-release.test.cjs

      - name: Build and run native tests sequentially
        shell: cmd
        run: build.cmd test

      - name: Build the optimized release executable
        shell: cmd
        run: build.cmd release

      - name: Exercise the exact release executable
        shell: cmd
        run: build\test_host.exe build/release/win-scratchpad.exe

      - name: Test version and packaging guards
        run: ./.github/tests/prepare-release.tests.ps1

      - name: Verify version metadata and package the portable build
        id: package
        run: ./.github/scripts/prepare-release.ps1

      - name: Pass only verified release assets to the publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release
          path: |
            build/release-assets/*.zip
            build/release-assets/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: false
          include-hidden-files: false
          archive: true

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Same-version reruns/pushes cannot race or cancel an in-flight publication.
    concurrency:
      group: release-${{ github.repository }}-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Check out the same trusted commit for the publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this run's verified build assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-release
          path: release-assets
          digest-mismatch: error

      - name: Create or resume a draft, verify assets, then publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_ASSET_DIR: release-assets
        with:
          github-token: ${{ github.token }}
          script: |
            const publishRelease = require('./.github/scripts/publish-release.cjs');
            await publishRelease({ github, context, core });
