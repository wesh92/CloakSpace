# CloakSpace configuration (Scratchpad DSL v1). UTF-8; this file is not TOML/YAML/JSON.
# Copy to %APPDATA%/cloakspace/scratchpad.conf or pass --config PATH.
# Profiles in a file define their complete key maps. Restart after editing.
# Choose disjoint shortcuts if other tools use Ctrl+Alt combinations (or AltGr).
# Windows Terminal/Podman are optional; scratch/window actions do not need them.
# import "profiles/work.conf"
# Block recognized elevation requests in every profile; ordinary execution is allowed.
# This is a bounded launch policy, not a sandbox. See docs/CONFIGURATION.md.
never-elevate
    all
end-never-elevate

# Optional global tint strength; profile-local values override it. Restart after editing.
# tint-opacity 0.14

profile default
    layout gap 12
    layout split longest
    layout anchor top-left
    layout single 70 75
    layout multi 90 85
    quake-window "_quake"
    # terminal.open uses your Windows Terminal default profile unless set here:
    # terminal-profile "Your Terminal Profile"
    bind Ctrl+Alt+S scratch.toggle
    bind Ctrl+Alt+Shift+S scratch.member
    bind Ctrl+Alt+P scratch.promote
    bind Ctrl+Alt+R scratch.restore
    bind Ctrl+Alt+Scan029 terminal.open
    # Optional Podman integration. Enable only after configuring your container:
    # container-filter "label=scratchpad=1"
    # container-profile "Your Terminal Profile"
    # container-directory "/app"
    # bind Ctrl+Alt+K terminal.container
    # Or choose a command installed IN that container (default is /bin/sh):
    # bind Ctrl+Alt+B terminal.container "/bin/bash" "-l"
end

# An alternative layout with additional window/process shortcuts.
# Select with --profile portable. Both profiles leave Windows Search/Snipping intact.
profile portable
    layout gap 16
    layout split alternate
    layout anchor top-right
    quake-window "_quake"

    bind Ctrl+Alt+S scratch.toggle
    bind Ctrl+Alt+Shift+S scratch.member
    bind Ctrl+Alt+P scratch.promote
    bind Ctrl+Alt+R scratch.restore
    bind Ctrl+Alt+Scan029 terminal.open
    bind Ctrl+Alt+C window.center
    bind Ctrl+Alt+T window.toggle-topmost
    bind Ctrl+Alt+M window.minimize
    bind Ctrl+Alt+N process.exec "notepad.exe"
    # Additional terminal profile, with no rebuild:
    # bind Ctrl+Alt+U terminal.quake "Ubuntu"
end
